# Profile: R35 — NIGMS ESI MIRA, PAR-27-032
#
# PAR-27-032 does not permit a Specific Aims attachment or that designation in
# the application. Its Research Strategy describes a program of research and
# does not use the standard Significance / Innovation / Approach headings.
# VERIFY these rules and limits against the NOFO for your receipt date.
#
# Activate with:  make sections MECH=r35      (or QUARTO_PROFILE=r35 quarto render)

params:
  mechanism: "ESI MIRA (R35; PAR-27-032)"
  page-limits:
    abstract: 1
    narrative: 1
    strategy: 6
    dms: 2
  # MIRA is single-PI, so 14-multiple-pd-pi-leadership never applies.
  sections:
    - 01-project-summary
    - 02-project-narrative
    - 04-research-strategy-mira
    - 05-budget-justification-mira
    - 06-facilities
    - 07-equipment
    - 08-data-management-sharing
    - 90-references

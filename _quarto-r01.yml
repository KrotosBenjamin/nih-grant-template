# Profile: R01 — Research Project Grant
#
# VERIFY page limits against your specific FOA before submitting. NIH limits
# vary by activity code and are re-set with each reissue; the values here are
# the common defaults, not a guarantee.
#
# Activate with:  make sections MECH=r01      (or QUARTO_PROFILE=r01 quarto render)

params:
  mechanism: "R01"
  page-limits:
    abstract: 1
    narrative: 1
    aims: 1
    strategy: 12
  # Sections built by `make sections MECH=r01`. Add or remove to match your
  # NOFO — e.g. drop 10/11 if you have no human subjects or animals, add
  # 14-multiple-pd-pi-leadership only if you designate more than one PD/PI.
  sections:
    - 01-project-summary
    - 02-project-narrative
    - 03-specific-aims
    - 04-research-strategy
    - 05-budget-justification
    - 06-facilities
    - 07-equipment
    - 08-data-management-sharing
    - 90-references
